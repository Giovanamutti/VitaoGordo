<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Livraria Multicultural - Cadastro de Livros</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <header class="header-livraria">
    <div class="header-logo-row">
      <a href="index.html"><img src="logo/logo.png" alt="Multicultural"></a>
      <h1 style="margin:0;">Livraria Multicultural</h1>
    </div>
    <p>Gestão e Cadastro de Livros</p>
    <p style="margin-top:.5rem;">
      <a href="login.html" style="color:#8b4513; font-weight:600; text-decoration:none;">← Cadastro de Clientes</a>
    </p>
  </header>

  <div class="pagina-container">
    <main class="container-card">
      <form id="formLivro">
        <fieldset>
          <legend>Novo Livro</legend>

          <div class="linha">
            <label class="campo-nome">
              <span>Título *</span>
              <input type="text" name="titulo" placeholder="Digite o título do livro" required>
            </label>
            <label class="campo-cep">
              <span>ISBN</span>
              <input type="text" name="isbn" placeholder="978-85-0000-000-0">
            </label>
          </div>

          <div class="linha">
            <label class="campo-nome">
              <span>Autor *</span>
              <input type="text" name="autor" placeholder="Nome do autor" required>
            </label>
            <label class="campo-telefone">
              <span>Gênero</span>
              <input type="text" name="genero" placeholder="Ex: Romance, Poesia...">
            </label>
          </div>

          <div class="linha">
            <label class="campo-cpf">
              <span>Preço (R$) *</span>
              <input type="number" name="preco" placeholder="49.90" step="0.01" min="0.01" required>
            </label>
            <label class="campo-data">
              <span>Estoque</span>
              <input type="number" name="estoque" placeholder="0" min="0" step="1" value="0">
            </label>
          </div>

          <div class="linha">
            <label class="campo-nome">
              <span>Editora</span>
              <input type="text" name="editora" placeholder="Ex: Companhia das Letras">
            </label>
            <label class="campo-data">
              <span>Páginas</span>
              <input type="number" name="paginas" placeholder="Ex: 320" min="1" step="1">
            </label>
          </div>

          <div class="linha">
              <label class="campo-nome">
                <span>Categoria *</span>
                <select name="categoria" required>
                  <option value="livro">Livro</option>
                  <option value="hq">HQ (História em Quadrinhos)</option>
                  <option value="manga">Mangá</option>
                  <option value="kit">Kit / Box</option>
                </select>
              </label>

              <label class="campo-nome">
                <span>Imagem de Capa</span>
                <input type="file" name="imagem" id="inputImagem"
                      accept="image/png,image/jpeg,image/jpg,image/webp,image/gif,image/svg+xml">
                <small style="display:block; font-size:0.7rem; color:#888; margin-top:.25rem;">
                  Formatos: PNG, JPG, JPEG, WEBP, GIF ou SVG (máx 5 MB).
                </small>
                <div id="previewImagemWrap" style="display:none; margin-top:.6rem;">
                  <img id="previewImagem" alt="Pré-visualização" style="
                    width: 80px; height: 110px; object-fit: cover;
                    border-radius: 6px; border: 2px solid #e2d7cd;
                    box-shadow: 0 2px 6px rgba(0,0,0,.08); display: block;
                  ">
                  <p id="previewNome" style="font-size:.7rem; color:#666; margin-top:.3rem;"></p>
                </div>
              </label>
              
          
            <label class="campo-data">
              <span>Origem *</span>
              <select name="origem" required>
                <option value="Nacional">Nacional</option>
                <option value="Internacional">Internacional</option>
              </select>
            </label>
          </div>

          <div class="linha">
            <label class="campo-nome">
              <span>Avaliação (0.1 a 5.0 estrelas)</span>
              <div style="display:flex; align-items:center; gap:.75rem;">
                <input
                  type="range"
                  id="avaliacaoRange"
                  name="avaliacao"
                  min="0" max="5" step="0.1" value="0"
                  oninput="document.getElementById('avaliacaoTexto').textContent = (this.value == 0 ? 'Sem avaliação' : Number(this.value).toFixed(1) + ' ★');">
                <span id="avaliacaoTexto" style="font-weight:700; color:#8b4513; min-width:110px; text-align:right;">Sem avaliação</span>
              </div>
              <small style="display:block; font-size:0.7rem; color:#888; margin-top:.25rem;">
                Arraste o slider. Nota <strong>0</strong> significa "ainda sem avaliação".
              </small>
            </label>
          </div>

          <button type="submit">Salvar Livro</button>
          <p id="avisoLivro"></p>
        </fieldset>
      </form>
    </main>

    <section class="secao-tabela">
      <h2>Livros Cadastrados</h2>
      <div class="tabela-container">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Capa</th>
              <th>Título</th>
              <th>Categoria</th>
              <th>Autor</th>
              <th>Editora</th>
              <th>Páginas</th>
              <th>Origem</th>
              <th>Gênero</th>
              <th>Preço</th>
              <th>Estoque</th>
              <th>ISBN</th>
              <th>Avaliação</th>
              <th>Ações</th>
              <th>Editar</th>

            </tr>
          </thead>
          <tbody id="corpoTabelaLivros"></tbody>
        </table>
      </div>
    </section>
  </div>
    <script src="js/mascaras.js"></script>
    <script src="js/script.js"></script>
      <!-- ============== MODAL DE EDIÇÃO DE LIVRO ============== -->
    <div id="modalEdicao" style="display:none; position:fixed; inset:0; z-index:1000; background:rgba(0,0,0,.6); backdrop-filter:blur(4px); padding:1rem; overflow-y:auto;">
      <div style="max-width:720px; margin:2rem auto; background:#fff; border-radius:16px; box-shadow:0 24px 60px rgba(0,0,0,.35); padding:2rem; position:relative;">
        <button type="button" id="btnFecharEdicao" style="position:absolute; top:1rem; right:1rem; width:36px; height:36px; border-radius:50%; background:#F4ECE1; border:none; cursor:pointer; font-size:1.1rem; display:flex; align-items:center; justify-content:center;">
          <i class="fa-solid fa-xmark"></i>
        </button>

        <h2 style="margin:0 0 1.5rem; color:#8b4513; font-size:1.5rem;">
          <i class="fa-solid fa-pen"></i> Editar Livro <span id="editId" style="color:#999; font-size:1rem;"></span>
        </h2>

        <form id="formEdicao">
          <div class="linha">
            <label class="campo-nome">
              <span>Título *</span>
              <input type="text" name="titulo" id="editTitulo" required>
            </label>
            <label class="campo-cep">
              <span>ISBN</span>
              <input type="text" name="isbn" id="editIsbn">
            </label>
          </div>

          <div class="linha">
            <label class="campo-nome">
              <span>Autor *</span>
              <input type="text" name="autor" id="editAutor" required>
            </label>
            <label class="campo-telefone">
              <span>Gênero</span>
              <input type="text" name="genero" id="editGenero">
            </label>
          </div>

          <div class="linha">
            <label class="campo-cpf">
              <span>Preço (R$) *</span>
              <input type="number" name="preco" id="editPreco" step="0.01" min="0.01" required>
            </label>
            <label class="campo-data">
              <span>Estoque</span>
              <input type="number" name="estoque" id="editEstoque" min="0" step="1">
            </label>
          </div>

          <div class="linha">
            <label class="campo-nome">
              <span>Editora</span>
              <input type="text" name="editora" id="editEditora">
            </label>
            <label class="campo-data">
              <span>Páginas</span>
              <input type="number" name="paginas" id="editPaginas" min="1" step="1">
            </label>
          </div>

          <div class="linha">
            <label class="campo-nome">
              <span>Categoria</span>
              <select name="categoria" id="editCategoria">
                <option value="livro">Livro</option>
                <option value="hq">HQ (História em Quadrinhos)</option>
                <option value="manga">Mangá</option>
                <option value="kit">Kit / Box</option>
              </select>
            </label>
            <label class="campo-data">
              <span>Origem</span>
              <select name="origem" id="editOrigem">
                <option value="Nacional">Nacional</option>
                <option value="Internacional">Internacional</option>
              </select>
            </label>
          </div>

          <div class="linha">
            <label class="campo-nome">
              <span>Imagem de Capa (opcional)</span>
              <input type="file" name="imagem" id="editInputImagem"
                    accept="image/png,image/jpeg,image/jpg,image/webp,image/gif,image/svg+xml">
              <small style="display:block; font-size:.7rem; color:#888; margin-top:.25rem;">
                Se não enviar nova, mantém a atual. Formatos: PNG, JPG, JPEG, WEBP, GIF ou SVG.
              </small>
              <div id="editPreviewWrap" style="display:none; margin-top:.6rem;">
                <img id="editPreview" alt="Preview" style="width:80px;height:110px;object-fit:cover;border-radius:6px;border:2px solid #e2d7cd;">
              </div>
            </label>
          </div>

          <div class="linha">
            <label class="campo-nome">
              <span>Avaliação</span>
              <div style="display:flex;align-items:center;gap:.75rem;">
                <input type="range" id="editAvaliacaoRange" name="avaliacao" min="0" max="5" step="0.1" value="0"
                      oninput="document.getElementById('editAvaliacaoTexto').textContent = (this.value == 0 ? 'Sem avaliação' : Number(this.value).toFixed(1) + ' ★');">
                <span id="editAvaliacaoTexto" style="font-weight:700;color:#8b4513;min-width:110px;text-align:right;">Sem avaliação</span>
              </div>
            </label>
          </div>

          <div style="display:flex; gap:.75rem; justify-content:flex-end; margin-top:1rem;">
            <button type="button" id="btnCancelarEdicao" style="background:#ddd; color:#333; padding:.75rem 1.5rem; border:none; border-radius:8px; font-weight:600; cursor:pointer;">
              Cancelar
            </button>
            <button type="submit" style="background:#8b4513; color:#fff; padding:.75rem 1.5rem; border:none; border-radius:8px; font-weight:600; cursor:pointer;">
              <i class="fa-solid fa-save"></i> Salvar Alterações
            </button>
          </div>

          <p id="avisoEdicao" style="margin-top:1rem; font-weight:600; font-size:.9rem;"></p>
        </form>
      </div>
    </div>
  </body>
</html>
