<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Livraria Multicultural - Cadastro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header-livraria">
    <h1>Livraria Multicultural</h1>
    <p>Gestão e Cadastro de Clientes</p>
  </header>

  <div class="pagina-container">
    <main class="container-card">
      <form id="formCliente">
        <fieldset>
          <legend>Novo Cliente</legend>

          <div class="linha">
            <label class="campo-nome">
              <span>Nome Completo *</span>
              <input type="text" name="nome" placeholder="Digite o nome completo" required>
            </label>
            <label class="campo-cep">
              <span>CEP *</span>
              <input type="text" name="cep" placeholder="85860-000" required>
            </label>
          </div>

          <div class="linha">
            <label class="campo-cpf">
              <span>CPF *</span>
              <input type="text" name="cpf" placeholder="000.000.000-00" required>
            </label>
            <label class="campo-telefone">
              <span>Telefone</span>
              <input type="text" name="telefone" placeholder="(00) 00000-0000">
            </label>
            <label class="campo-data">
              <span>Data de Nascimento</span>
              <input type="date" name="nascimento" id="data">
            </label>
          </div>

          <button type="submit">Salvar Cliente</button>
          <p id="aviso"></p>
        </fieldset>
      </form>
    </main>

    <section class="secao-tabela">
      <h2>Clientes Cadastrados</h2>
      <div class="tabela-container">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>CEP</th>
              <th>Nome</th>
              <th>Telefone</th>
              <th>CPF</th>
              <th>Data Nasc.</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="corpoTabela"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="script.js"></script>

</body>
</html>
