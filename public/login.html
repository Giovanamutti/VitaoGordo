<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar / Criar Conta | Livraria Multicultural</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* ====================================================================
       Reset + base
       ==================================================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
      text-decoration: none;
      color: #1A1818;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(circle at 15% 15%, rgba(244, 208, 63, 0.12), transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(192, 57, 43, 0.18), transparent 40%),
        linear-gradient(135deg, #1B4D3E 0%, #245C4A 45%, #8D5524 100%);
    }

    /* ====================================================================
       Header minimalista
       ==================================================================== */
    header.top-bar {
      padding: 24px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid rgba(244, 208, 63, 0.25);
    }

    header.top-bar .marca {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header.top-bar .marca img {
      width: 44px;
      height: 44px;
      object-fit: contain;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.35));
    }

    header.top-bar .marca-texto {
      display: flex;
      flex-direction: column;
      line-height: 1;
    }

    header.top-bar .marca-texto strong {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      color: #FDFBF7;
      letter-spacing: 0.02em;
    }

    header.top-bar .marca-texto small {
      color: #F4D03F;
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      margin-top: 4px;
      font-weight: 600;
    }

    header.top-bar .voltar {
      color: #FDFBF7;
      font-size: 0.8rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      opacity: 0.85;
      transition: opacity 0.2s, color 0.2s;
    }

    header.top-bar .voltar:hover {
      opacity: 1;
      color: #F4D03F;
    }

    /* ====================================================================
       Main + card
       ==================================================================== */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
      box-shadow: inset 0px 2px 3px rgba(0, 0, 0, 0.15);
    }

    main .card-login {
      width: 100%;
      max-width: 440px;
      background-color: #FDFBF7;
      border-radius: 18px;
      padding: 32px 28px;
      border: 1px solid rgba(244, 208, 63, 0.25);
      box-shadow:
        0 16px 48px rgba(0, 0, 0, 0.35),
        0 4px 12px rgba(0, 0, 0, 0.20);
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: aparecer 0.4s ease both;
    }

    @keyframes aparecer {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    main .card-login h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      color: #1B4D3E;
      margin-bottom: 4px;
      font-weight: 700;
    }

    main .card-login .subtitulo {
      font-size: 0.85rem;
      color: #6b625a;
      margin-bottom: 24px;
      text-align: center;
    }

    /* ====================================================================
       Abas (Entrar / Criar Conta)
       ==================================================================== */
    main .abas {
      width: 100%;
      display: flex;
      gap: 6px;
      padding: 5px;
      background-color: #F4ECE1;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    main .abas .aba-btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 10px 12px;
      border-radius: 9px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      color: #6b625a;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, box-shadow 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    main .abas .aba-btn.ativo {
      background: linear-gradient(135deg, #1B4D3E 0%, #245C4A 60%, #C0392B 140%);
      color: #F4D03F;
      box-shadow: 0 4px 12px rgba(27, 77, 62, 0.4);
    }

    main .abas .aba-btn:not(.ativo):hover {
      background-color: rgba(27, 77, 62, 0.08);
      color: #1B4D3E;
    }

    /* ====================================================================
       Painéis das abas
       ==================================================================== */
    main .aba-painel {
      display: none;
      width: 100%;
      animation: fadeIn 0.25s ease;
    }

    main .aba-painel.ativo {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ====================================================================
       Inputs
       ==================================================================== */
    main .campo {
      width: 100%;
      margin-bottom: 14px;
    }

    main .campo-label {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      color: #5c534d;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    main .input-wrap {
      position: relative;
    }

    main .input-wrap input {
      width: 100%;
      height: 45px;
      padding: 8px 15px 8px 42px;
      border: 0;
      outline: 0;
      border-radius: 12px;
      font-size: 0.92rem;
      color: #1A1818;
      background-color: #fbf7f1;
      box-shadow: inset 0 0 0 1px #e6dbcc;
      transition: box-shadow 0.2s, background-color 0.2s;
      font-family: 'Poppins', sans-serif;
    }

    main .input-wrap input:focus {
      background-color: #fff;
      box-shadow:
        inset 0 0 0 2px #1B4D3E,
        0 0 0 4px rgba(27, 77, 62, 0.12);
    }

    main .input-wrap input::placeholder {
      color: #b0a79e;
      font-size: 0.85rem;
    }

    /* Ícone à esquerda */
    main .input-wrap > i.icone-esq {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #C0392B;
      font-size: 0.85rem;
      pointer-events: none;
    }

    /* Ícone de olho (direita) */
    main .input-wrap .olho {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #8a817a;
      cursor: pointer;
      font-size: 0.9rem;
      transition: color 0.2s;
      padding: 4px;
    }

    main .input-wrap .olho:hover {
      color: #1B4D3E;
    }

    main .input-wrap .olho.oculto {
      display: none;
    }

    /* ====================================================================
       Linha "lembrar senha" + "esqueceu"
       ==================================================================== */
    main .password-infos {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: -2px 0 18px;
      font-size: 0.78rem;
    }

    main .password-infos label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #5c534d;
      cursor: pointer;
    }

    main .password-infos input[type="checkbox"] {
      accent-color: #1B4D3E;
      cursor: pointer;
      width: 14px;
      height: 14px;
    }

    main .password-infos a {
      color: #C0392B;
      font-weight: 600;
      transition: color 0.2s;
    }

    main .password-infos a:hover {
      color: #8D5524;
    }

    /* ====================================================================
       Botão principal
       ==================================================================== */
    main .btn-principal {
      width: 100%;
      height: 50px;
      border: 0;
      outline: 0;
      border-radius: 12px;
      font-family: 'Poppins', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      color: #F4D03F;
      background: linear-gradient(135deg, #1B4D3E 0%, #245C4A 100%);
      cursor: pointer;
      transition: background 0.25s, transform 0.2s, box-shadow 0.2s, color 0.2s;
      box-shadow: 0 6px 16px rgba(27, 77, 62, 0.35);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    main .btn-principal:hover {
      background: linear-gradient(135deg, #C0392B 0%, #8D5524 100%);
      color: #FDFBF7;
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(192, 57, 43, 0.4);
    }

    main .btn-principal:active {
      transform: translateY(0);
    }

    /* ====================================================================
       Separador + redes sociais
       ==================================================================== */
    main .links-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 22px;
    }

    main .links-container > span {
      font-size: 0.78rem;
      color: #8a817a;
      font-weight: 500;
      position: relative;
      padding: 0 12px;
      background-color: #FDFBF7;
    }

    main .links-container .divisor {
      width: 100%;
      height: 1px;
      background-color: #e6dbcc;
      position: relative;
      margin-bottom: -10px;
    }

    main .links-container .redes {
      margin-top: 18px;
      width: 60%;
      display: flex;
      align-items: center;
      justify-content: space-around;
    }

    main .links-container .redes a {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #F4ECE1;
      color: #1B4D3E;
      font-size: 1.05rem;
      transition: background 0.2s, color 0.2s, transform 0.2s;
    }

    main .links-container .redes a:hover {
      transform: translateY(-2px);
      color: #fff;
    }

    main .links-container .redes a.google:hover   { background-color: #e34133; }
    main .links-container .redes a.facebook:hover { background-color: #14a0f9; }
    main .links-container .redes a.linkedin:hover { background-color: #0a66c2; }

    /* ====================================================================
       Rodapé do card
       ==================================================================== */
    main .rodape-card {
      width: 100%;
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid #e6dbcc;
      text-align: center;
    }

    main .rodape-card span {
      font-size: 0.8rem;
      color: #5c534d;
    }

    main .rodape-card button {
      background: none;
      border: none;
      font-family: 'Poppins', sans-serif;
      color: #C0392B;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.8rem;
      padding: 0 4px;
      transition: color 0.2s;
    }

    main .rodape-card button:hover {
      color: #1B4D3E;
    }

    /* ====================================================================
       Mensagem de status (avisoAuth)
       ==================================================================== */
    #avisoAuth {
      width: 100%;
      margin-top: 12px;
      text-align: center;
      font-size: 0.82rem;
      font-weight: 600;
      color: #1B4D3E;
    }

    #avisoAuth.erro {
      color: #C0392B;
    }

    /* Aviso informativo (dentro da aba de cadastro) */
    .aviso-sessao {
      background-color: #fff8e1;
      border: 1px solid #f4d03f;
      color: #8b4513;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.75rem;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 16px;
      width: 100%;
      line-height: 1.4;
    }

    .aviso-sessao i {
      margin-top: 2px;
      color: #C0392B;
    }

    /* ====================================================================
       Responsivo
       ==================================================================== */
    @media (max-width: 480px) {
      header.top-bar {
        padding: 16px 20px;
      }

      header.top-bar .marca img {
        width: 36px;
        height: 36px;
      }

      header.top-bar .marca-texto strong {
        font-size: 1rem;
      }

      main {
        padding: 24px 12px;
      }

      main .card-login {
        padding: 24px 20px;
      }

      main .card-login h2 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>

<body>

  <!-- ================= HEADER ================= -->
  <header class="top-bar">
    <div class="marca">
      <img src="logo/logo.png" alt="Multicultural">
      <div class="marca-texto">
        <strong>Multicultural</strong>
        <small>Livraria & Cultura</small>
      </div>
    </div>
    <a href="index.html" class="voltar">
      <i class="fa-solid fa-arrow-left"></i>
      Voltar ao site
    </a>
  </header>

  <!-- ================= MAIN ================= -->
  <main>
    <div class="card-login">

      <h2>Bem-vindo(a)!</h2>
      <p class="subtitulo">Entre na sua conta ou crie uma nova para continuar.</p>

      <!-- ============ ABAS ============ -->
      <div class="abas">
        <button type="button" class="aba-btn ativo" data-tab="entrar">
          <i class="fa-solid fa-right-to-bracket"></i> Entrar
        </button>
        <button type="button" class="aba-btn" data-tab="cadastrar">
          <i class="fa-solid fa-user-plus"></i> Criar Conta
        </button>
      </div>

      <!-- ============ PAINEL: ENTRAR ============ -->
      <div class="aba-painel ativo" id="painel-entrar">
        <form id="formLogin" autocomplete="on">

          <div class="campo">
            <label class="campo-label" for="login-usuario">Nome de Usuário</label>
            <div class="input-wrap">
              <i class="fa-solid fa-user icone-esq"></i>
              <input
                type="text"
                id="login-usuario"
                name="nome_usuario"
                placeholder="seu_usuario"
                required
                autocomplete="username"
              >
            </div>
          </div>

          <div class="campo">
            <label class="campo-label" for="login-senha">Senha</label>
            <div class="input-wrap">
              <i class="fa-solid fa-lock icone-esq"></i>
              <input
                type="password"
                id="login-senha"
                name="senha"
                placeholder="••••••••"
                required
                autocomplete="current-password"
              >
              <i class="fa-solid fa-eye olho oculto" data-olho="login-senha"></i>
              <i class="fa-solid fa-eye-slash olho" data-olho="login-senha"></i>
            </div>
          </div>

          <div class="password-infos">
            <label>
              <input type="checkbox">
              <span>Lembrar senha</span>
            </label>
            <a href="#">Esqueceu sua senha?</a>
          </div>

          <button type="submit" class="btn-principal">
            <i class="fa-solid fa-right-to-bracket"></i>
            Entrar
          </button>
        </form>
      </div>

      <!-- ============ PAINEL: CRIAR CONTA ============ -->
      <div class="aba-painel" id="painel-cadastrar">

        <div class="aviso-sessao">
          <i class="fa-solid fa-circle-info"></i>
          <span>A foto de perfil poderá ser enviada depois, dentro da sua conta.</span>
        </div>

        <form id="formCadastroUsuario" autocomplete="on">

          <div class="campo">
            <label class="campo-label" for="cad-nome">Nome Completo</label>
            <div class="input-wrap">
              <i class="fa-solid fa-signature icone-esq"></i>
              <input type="text" id="cad-nome" name="nome_completo" placeholder="Seu nome completo" required>
            </div>
          </div>

          <div class="campo">
            <label class="campo-label" for="cad-usuario">Nome de Usuário</label>
            <div class="input-wrap">
              <i class="fa-solid fa-at icone-esq"></i>
              <input type="text" id="cad-usuario" name="nome_usuario" placeholder="seu_usuario" required minlength="3">
            </div>
          </div>

          <div class="campo">
            <label class="campo-label" for="cad-email">Email</label>
            <div class="input-wrap">
              <i class="fa-solid fa-envelope icone-esq"></i>
              <input type="email" id="cad-email" name="email" placeholder="voce@email.com" required>
            </div>
          </div>

          <div class="campo">
            <label class="campo-label" for="cad-telefone">Telefone</label>
            <div class="input-wrap">
              <i class="fa-solid fa-phone icone-esq"></i>
              <input type="text" id="cad-telefone" name="telefone" placeholder="(00) 00000-0000">
            </div>
          </div>

          <div class="campo">
            <label class="campo-label" for="cad-cpf">CPF</label>
            <div class="input-wrap">
              <i class="fa-solid fa-id-card icone-esq"></i>
              <input type="text" id="cad-cpf" name="cpf" placeholder="000.000.000-00">
            </div>
          </div>

          <div class="campo">
            <label class="campo-label" for="cad-nascimento">Data de Nascimento</label>
            <div class="input-wrap">
              <i class="fa-solid fa-calendar icone-esq"></i>
              <input type="date" id="cad-nascimento" name="data_nascimento">
            </div>
          </div>

          <div class="campo">
            <label class="campo-label" for="cad-cep">CEP</label>
            <div class="input-wrap">
              <i class="fa-solid fa-location-dot icone-esq"></i>
              <input type="text" id="cad-cep" name="cep" placeholder="00000-000">
            </div>
          </div>

          <div class="campo">
            <label class="campo-label" for="cad-senha">Senha <small style="font-weight:400;text-transform:none;letter-spacing:0;">(mín. 6 caracteres)</small></label>
            <div class="input-wrap">
              <i class="fa-solid fa-lock icone-esq"></i>
              <input
                type="password"
                id="cad-senha"
                name="senha"
                placeholder="••••••••"
                required
                minlength="6"
                autocomplete="new-password"
              >
              <i class="fa-solid fa-eye olho oculto" data-olho="cad-senha"></i>
              <i class="fa-solid fa-eye-slash olho" data-olho="cad-senha"></i>
            </div>
          </div>

          <div class="campo">
            <label class="campo-label" for="cad-senha-confirm">Confirmar Senha</label>
            <div class="input-wrap">
              <i class="fa-solid fa-lock-open icone-esq"></i>
              <input
                type="password"
                id="cad-senha-confirm"
                name="senha_confirm"
                placeholder="••••••••"
                required
                minlength="6"
                autocomplete="new-password"
              >
              <i class="fa-solid fa-eye olho oculto" data-olho="cad-senha-confirm"></i>
              <i class="fa-solid fa-eye-slash olho" data-olho="cad-senha-confirm"></i>
            </div>
          </div>

          <button type="submit" class="btn-principal">
            <i class="fa-solid fa-user-plus"></i>
            Criar minha conta
          </button>
        </form>
      </div>

      <!-- ============ REDES SOCIAIS ============ -->
      <div class="links-container">
        <div class="divisor"></div>
        <span>Ou entre com:</span>
        <div class="redes">
          <a href="#" class="google" title="Google"><i class="fa-brands fa-google-plus-g"></i></a>
          <a href="#" class="facebook" title="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
          <a href="#" class="linkedin" title="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
        </div>
      </div>

      <!-- ============ RODAPÉ DO CARD ============ -->
      <div class="rodape-card">
        <span id="rodape-texto">Ainda não possui uma conta?</span>
        <button type="button" id="btn-rodape">Cadastre-se</button>
      </div>

      <!-- ============ MENSAGEM DE STATUS ============ -->
      <p id="avisoAuth"></p>

    </div>
  </main>

  <!-- ================= SCRIPTS ================= -->
  <script src="js/mascaras.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (function () {
      'use strict';

      const $ = (s) => document.querySelector(s);
      const $$ = (s) => document.querySelectorAll(s);

      const aviso = $('#avisoAuth');

      function mostrarAviso(texto, erro) {
        if (!aviso) return;
        aviso.textContent = texto;
        aviso.className = erro ? 'erro' : '';
      }

      // ----------------------------------------------------------------
      // Mostrar/ocultar senha
      // ----------------------------------------------------------------
      $$('.olho').forEach(icone => {
        icone.addEventListener('click', () => {
          const idAlvo = icone.getAttribute('data-olho');
          const input = document.getElementById(idAlvo);
          if (!input) return;

          const wrap = icone.closest('.input-wrap');
          const olhoAberto = wrap.querySelector('.fa-eye');
          const olhoFechado = wrap.querySelector('.fa-eye-slash');

          if (input.type === 'password') {
            input.type = 'text';
            olhoAberto.classList.remove('oculto');
            olhoFechado.classList.add('oculto');
          } else {
            input.type = 'password';
            olhoAberto.classList.add('oculto');
            olhoFechado.classList.remove('oculto');
          }
        });
      });

      // ----------------------------------------------------------------
      // Abas
      // ----------------------------------------------------------------
      function ativarAba(nome) {
        $$('.aba-btn').forEach(b => b.classList.toggle('ativo', b.dataset.tab === nome));
        $$('.aba-painel').forEach(p => p.classList.toggle('ativo', p.id === 'painel-' + nome));

        const rodapeTexto = $('#rodape-texto');
        const btnRodape = $('#btn-rodape');
        if (nome === 'entrar') {
          rodapeTexto.textContent = 'Ainda não possui uma conta?';
          btnRodape.textContent = 'Cadastre-se';
          btnRodape.dataset.acao = 'cadastrar';
        } else {
          rodapeTexto.textContent = 'Já possui uma conta?';
          btnRodape.textContent = 'Faça login';
          btnRodape.dataset.acao = 'entrar';
        }

        aviso.textContent = '';
      }

      $$('.aba-btn').forEach(btn => {
        btn.addEventListener('click', () => ativarAba(btn.dataset.tab));
      });

      const btnRodape = $('#btn-rodape');
      if (btnRodape) {
        btnRodape.dataset.acao = 'cadastrar';
        btnRodape.addEventListener('click', () => {
          ativarAba(btnRodape.dataset.acao);
        });
      }

      // ----------------------------------------------------------------
      // Login
      // ----------------------------------------------------------------
      const formLogin = $('#formLogin');
      formLogin.addEventListener('submit', (e) => {
        e.preventDefault();
        const fd = new FormData(formLogin);
        const dados = {};
        fd.forEach((v, k) => { dados[k] = v; });

        fetch('/api/usuario/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dados)
        })
          .then(r => r.json().then(c => ({ ok: r.ok, c })))
          .then(({ ok, c }) => {
            if (!ok) return mostrarAviso(c.erro || 'Falha no login.', true);

            window.Auth.salvarUsuario(c);
            mostrarAviso('Login realizado! Sincronizando carrinho...', false);

            window.Auth.aoLogar().then(() => {
              setTimeout(() => window.location.href = 'conta.html', 400);
            });
          })
          .catch(err => mostrarAviso('Erro de comunicação: ' + err.message, true));
      });

      // ----------------------------------------------------------------
      // Cadastro
      // ----------------------------------------------------------------
      const formCad = $('#formCadastroUsuario');
      formCad.addEventListener('submit', (e) => {
        e.preventDefault();
        const fd = new FormData(formCad);
        const dados = {};
        fd.forEach((v, k) => { dados[k] = v; });

        if (dados.senha !== dados.senha_confirm) {
          return mostrarAviso('As senhas não coincidem.', true);
        }
        delete dados.senha_confirm;

        fetch('/api/usuario/registrar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dados)
        })
          .then(r => r.json().then(c => ({ ok: r.ok, c })))
          .then(({ ok, c }) => {
            if (!ok) return mostrarAviso(c.erro || 'Falha no cadastro.', true);

            window.Auth.salvarUsuario(c);
            mostrarAviso('Conta criada! Sincronizando carrinho...', false);

            window.Auth.aoLogar().then(() => {
              setTimeout(() => window.location.href = 'conta.html', 400);
            });
          })
          .catch(err => mostrarAviso('Erro de comunicação: ' + err.message, true));
      });

    })();
  </script>
</body>
</html>
