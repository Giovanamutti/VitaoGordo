<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Identificação - Cliente</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
    }

    .login-container {
      width: 100%;
      max-width: 450px;
      padding: 2rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      background-color: #fff;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .login-container h2 {
      text-align: center;
      margin-bottom: 1.5rem;
      color: #333;
    }

    .form-group {
      margin-bottom: 1rem;
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      margin-bottom: 0.3rem;
      font-weight: bold;
      color: #555;
    }

    .form-group input {
      padding: 0.65rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.95rem;
    }

    .btn-login {
      width: 100%;
      padding: 0.75rem;
      margin-top: 1rem;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      background-color: #007bff;
      color: #fff;
      border: none;
    }

    .btn-login:hover {
      background-color: #0056b3;
    }

    #aviso {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.9rem;
      font-weight: bold;
    }

    .erro {
      color: red;
    }

    .sucesso {
      color: green;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <h2>Validação do Cliente</h2>

    <div id="aviso"></div>

    <form id="formLogin">
      <div class="form-group">
        <label for="nome">Nome Completo</label>
        <input type="text" id="nome" name="nome" placeholder="Ex: Vitor" required>
      </div>

      <div class="form-group">
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" name="cpf" placeholder="Ex: 096.096.709-75" required>
      </div>

      <div class="form-group">
        <label for="telefone">Telefone</label>
        <input type="text" id="telefone" name="telefone" placeholder="Ex: +55 45 9999-9999" required>
      </div>

      <div class="form-group">
        <label for="nascimento">Data de Nascimento</label>
        <input type="text" id="nascimento" name="nascimento" placeholder="Ex: 22/03/2010" required>
      </div>

      <div class="form-group">
        <label for="cep">CEP</label>
        <input type="text" id="cep" name="cep" placeholder="Ex: 87855997" required>
      </div>

      <button type="submit" class="btn-login">Validar e Entrar</button>
    </form>
  </div>

  <script>
    const formLogin = document.getElementById('formLogin');
    const aviso = document.getElementById('aviso');

    function mostrarAviso(texto, ehErro) {
      aviso.textContent = texto;
      aviso.className = ehErro ? 'erro' : 'sucesso';
    }

    formLogin.addEventListener('submit', function (e) {
      e.preventDefault();

      const dados = {
        nome: document.getElementById('nome').value.trim(),
        cpf: document.getElementById('cpf').value.trim(),
        telefone: document.getElementById('telefone').value.trim(),
        nascimento: document.getElementById('nascimento').value.trim(),
        cep: document.getElementById('cep').value.trim()
      };

      fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dados)
      })
      .then(function (resposta) {
        return resposta.json().then(function (corpo) {
          return { ok: resposta.ok, corpo: corpo };
        });
      })
      .then(function (resultado) {
        if (!resultado.ok) {
          mostrarAviso(resultado.corpo.erro, true);
          return;
        }

        mostrarAviso('Dados validados com sucesso! Redirecionando...', false);

        localStorage.setItem('clienteLogado', JSON.stringify(resultado.corpo.cliente));

        setTimeout(function () {
          window.location.href = '/';
        }, 1200);
      })
      .catch(function (erro) {
        mostrarAviso('Erro de conexão com o servidor: ' + erro.message, true);
      });
    });
  </script>
</body>
</html>
